# ==============================================================================
# Sys-Guardian Central Configuration
# Installed in: /etc/sys-guardian/sys-guardian.conf
# ==============================================================================

[thresholds]
# Alert when root (/) partition exceeds this percentage
disk_warn_threshold=90

# Alert when CPU or Motherboard thermal zone exceeds this Celsius value
temp_warn_threshold=92

# Alert when Linux PSI memory stall 10-second average exceeds this percentage
psi_stall_threshold=40

[checks]
# Enable or disable individual monitoring subsystems
check_gpu=true
check_packages=true
check_storage_io=true
check_services=true
check_thermals=true
check_memory_pressure=true
